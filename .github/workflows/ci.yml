# Pipeline léger : génération OpenAPI, build et tests backend, build et tests frontend, image Docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (OpenAPI, build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build et tests (Testcontainers PostgreSQL)
        run: ./gradlew build
      - name: Rapport de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-backend
          path: backend/*/build/reports/tests/test

  frontend:
    name: Frontend (types, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: carsupervision:ci
