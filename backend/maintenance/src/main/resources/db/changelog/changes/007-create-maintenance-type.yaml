databaseChangeLog:
  - changeSet:
      id: 007-create-maintenance-type
      author: carsupervision
      comment: Catalogue des types d'entretien géré par l'ADMIN (research R9), pré-rempli avec des valeurs marocaines.
      changes:
        - createTable:
            tableName: maintenance_type
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_maintenance_type
              - column:
                  name: name
                  type: varchar(60)
                  constraints:
                    nullable: false
              - column:
                  name: name_key
                  type: varchar(60)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_maintenance_type_name_key
              - column:
                  name: category
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: default_interval_km
                  type: integer
              - column:
                  name: default_interval_months
                  type: smallint
              - column:
                  name: requires_description
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: suggest_from_age_years
                  type: smallint
              - column:
                  name: display_order
                  type: smallint
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE maintenance_type
                ADD CONSTRAINT ck_maintenance_type_category CHECK (category IN ('MAINTENANCE', 'ADMINISTRATIVE')),
                ADD CONSTRAINT ck_maintenance_type_interval_km CHECK (default_interval_km IS NULL
                  OR (category = 'MAINTENANCE' AND default_interval_km BETWEEN 1 AND 1000000)),
                ADD CONSTRAINT ck_maintenance_type_interval_months CHECK (default_interval_months IS NULL
                  OR default_interval_months BETWEEN 1 AND 240),
                ADD CONSTRAINT ck_maintenance_type_requires_description CHECK (NOT requires_description
                  OR category = 'MAINTENANCE'),
                ADD CONSTRAINT ck_maintenance_type_suggest_age CHECK (suggest_from_age_years IS NULL
                  OR (category = 'ADMINISTRATIVE' AND suggest_from_age_years BETWEEN 0 AND 50))
        - sql:
            comment: Types pré-remplis (identifiants fixes, data-model.md).
            sql: >
