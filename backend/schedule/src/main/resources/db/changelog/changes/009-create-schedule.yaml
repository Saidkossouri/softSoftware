databaseChangeLog:
  - changeSet:
      id: 009-create-schedule
      author: carsupervision
      comment: Règles d'échéance, échéances à date fixe et suggestions ignorées (fonctionnalité 002, US4).
      changes:
        - createTable:
            tableName: maintenance_rule
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_maintenance_rule
              - column:
                  name: vehicle_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_maintenance_rule_vehicle
                    references: vehicle(id)
                    deleteCascade: true
              - column:
                  name: type_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_maintenance_rule_type
                    references: maintenance_type(id)
              - column:
                  name: interval_km
                  type: integer
              - column:
                  name: interval_months
                  type: smallint
              - column:
                  name: baseline_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: baseline_mileage_km
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: maintenance_rule
            columnNames: vehicle_id, type_id
            constraintName: uk_maintenance_rule_vehicle_type
        - sql:
            sql: >
              ALTER TABLE maintenance_rule
                ADD CONSTRAINT ck_maintenance_rule_interval
                  CHECK (interval_km IS NOT NULL OR interval_months IS NOT NULL),
                ADD CONSTRAINT ck_maintenance_rule_km
                  CHECK (interval_km IS NULL OR interval_km BETWEEN 1 AND 1000000),
                ADD CONSTRAINT ck_maintenance_rule_months
                  CHECK (interval_months IS NULL OR interval_months BETWEEN 1 AND 240),
                ADD CONSTRAINT ck_maintenance_rule_baseline_km CHECK (baseline_mileage_km >= 0)
        - createTable:
            tableName: deadline
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_deadline
              - column:
                  name: vehicle_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_deadline_vehicle
                    references: vehicle(id)
                    deleteCascade: true
              - column:
                  name: type_id
                  type: uuid
                  constraints:
                    foreignKeyName: fk_deadline_type
                    references: maintenance_type(id)
              - column:
                  name: label
                  type: varchar(60)
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: recurrence_months
                  type: smallint
              - column:
                  name: done_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE deadline
                ADD CONSTRAINT ck_deadline_label CHECK (length(trim(label)) > 0),
                ADD CONSTRAINT ck_deadline_recurrence
                  CHECK (recurrence_months IS NULL OR recurrence_months BETWEEN 1 AND 120)
        - createIndex:
            tableName: deadline
            indexName: ix_deadline_vehicle
            columns:
              - column:
                  name: vehicle_id
        - createTable:
            tableName: deadline_suggestion_dismissal
            columns:
              - column:
                  name: vehicle_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_deadline_dismissal_vehicle
                    references: vehicle(id)
                    deleteCascade: true
              - column:
                  name: type_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_deadline_dismissal_type
                    references: maintenance_type(id)
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: deadline_suggestion_dismissal
            columnNames: vehicle_id, type_id
            constraintName: pk_deadline_suggestion_dismissal
