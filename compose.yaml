# Trois services, lançables ensemble ou séparément :
#   docker compose up -d --build            tout : base, backend (:8080), frontend (:5173)
#   docker compose up -d postgres           base seule (mode développement : backend et frontend en natif)
#   docker compose up -d --build backend    backend (démarre aussi la base dont il dépend)
#   docker compose up -d --build frontend   frontend seul ; il relaie /api vers le service backend
# Les variables viennent du fichier .env à la racine.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carsupervision
      POSTGRES_USER: ${DATABASE_USERNAME:-carsupervision}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-carsupervision}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d carsupervision"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: carsupervision-backend:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Dans le réseau Compose, la base est joignable sous le nom de son service.
      DATABASE_URL: jdbc:postgresql://postgres:5432/carsupervision
      DATABASE_USERNAME: ${DATABASE_USERNAME:-carsupervision}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-carsupervision}
      # Profil dev : cookie de session sans l'attribut Secure, car l'accès local se fait en http.
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: carsupervision-frontend:local
    environment:
      BACKEND_URL: http://backend:8080
    # Même port que le serveur Vite : l'URI de retour Google déjà déclarée
    # (http://localhost:5173/login/oauth2/code/google) fonctionne sans changement.
    ports:
      - "5173:80"

volumes:
  postgres-data:
