# Infrastructure de développement : PostgreSQL uniquement (le backend et le frontend tournent en natif).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carsupervision
      POSTGRES_USER: ${DATABASE_USERNAME:-carsupervision}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-carsupervision}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d carsupervision"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
