openapi: 3.0.3
# OpenAPI 3.0.3 est choisi pour une compatibilité complète avec openapi-generator (spring)
# et openapi-typescript.
info:
  title: carSupervision API
  version: 0.2.0
  description: |
    API REST de carSupervision (suivi d'entretien des véhicules de la famille).

    **Authentification** : session par cookie après connexion Google (OpenID Connect).
    Les points d'entrée suivants sont fournis par Spring Security et ne font pas partie des
    interfaces générées :
    - `GET /oauth2/authorization/google` : démarre la connexion Google ;
    - `GET /login/oauth2/code/google` : retour de Google ; un compte absent de la liste
      blanche ou dont l'email n'est pas vérifié reçoit une page HTML en **403** ;
    - `POST /logout` : ferme la session (en-tête `X-XSRF-TOKEN` requis), répond 204.

    **CSRF** : toute requête `POST`, `PUT`, `PATCH` ou `DELETE` doit renvoyer la valeur du
    cookie `XSRF-TOKEN` dans l'en-tête `X-XSRF-TOKEN`.

    **Erreurs** : format Problem Details (RFC 9457), messages en français dans `detail`.
servers:
  - url: /api
tags:
  - name: session
    description: Membre connecté
  - name: members
    description: Gestion des membres et de leurs rôles (ADMIN uniquement)
  - name: vehicles
    description: Parc de véhicules
  - name: vehicle-access
    description: Véhicules attribués à chaque membre (ADMIN uniquement)
  - name: mileage
    description: Relevés kilométriques et kilométrage actuel
  - name: maintenance
    description: Entretiens réalisés et historique d'un véhicule
  - name: schedule
    description: Règles d'échéance, échéances à date fixe et rappels
  - name: documents
    description: Justificatifs (factures en PDF, photos) rattachés aux entretiens

security:
  - sessionCookie: []

paths:
  /me:
    get:
      tags: [session]
      operationId: getCurrentMember
      summary: Membre actuellement connecté
      description: Nom, email et rôle du membre connecté (FR-014).
      responses:
        '200':
          description: Membre connecté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentMember'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /members:
    get:
      tags: [members]
      operationId: listMembers
      summary: Lister les membres de la liste blanche
      responses:
        '200':
          description: Membres triés par nom affiché puis email
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [members]
      operationId: createMember
      summary: Ajouter un membre à la liste blanche
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreateRequest'
      responses:
        '201':
          description: Membre ajouté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email déjà présent (`EMAIL_ALREADY_EXISTS`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    get:
      tags: [members]
      operationId: getMember
      summary: Détail d'un membre
      responses:
        '200':
          description: Membre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [members]
      operationId: updateMember
      summary: Modifier le nom affiché ou le rôle d'un membre
      description: |
        Les champs absents ne sont pas modifiés. Passer le dernier ADMIN en USER est refusé
        (409 `LAST_ADMIN`). Le nouveau rôle s'applique dès la requête suivante du membre.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdateRequest'
      responses:
        '200':
          description: Membre modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Il doit rester au moins un ADMIN (`LAST_ADMIN`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [members]
      operationId: deleteMember
      summary: Retirer l'accès d'un membre
      description: |
        Supprime le membre de la liste blanche et ses attributions de véhicules. Sa requête
        suivante est refusée, même avec une session ouverte. Retirer le dernier ADMIN est
        refusé (409 `LAST_ADMIN`).
      responses:
        '204':
          description: Membre retiré
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Il doit rester au moins un ADMIN (`LAST_ADMIN`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /members/{memberId}/vehicles:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    get:
      tags: [vehicle-access]
      operationId: getMemberVehicleAccess
      summary: Véhicules attribués à un membre
      responses:
        '200':
          description: Identifiants des véhicules attribués (actifs et archivés)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [vehicle-access]
      operationId: replaceMemberVehicleAccess
      summary: Remplacer l'ensemble des véhicules attribués à un membre USER
      description: |
        Remplace en une seule opération la liste des véhicules attribués (liste vide = aucun
        véhicule). Refusé pour un membre ADMIN (409 `MEMBER_IS_ADMIN`), qui voit déjà tout le
        parc. Prend effet dès la requête suivante du membre.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleAccess'
      responses:
        '200':
          description: Attributions enregistrées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Le membre est ADMIN (`MEMBER_IS_ADMIN`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /vehicles:
    get:
      tags: [vehicles]
      operationId: listVehicles
      summary: Lister les véhicules visibles par le membre connecté
      description: |
        ADMIN : tous les véhicules du statut demandé. USER : uniquement ses véhicules actifs
        attribués ; demander `status=ARCHIVED` est refusé (403). Une liste vide pour un USER
        signifie qu'aucun véhicule ne lui est attribué (FR-023).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/VehicleStatus'
          description: Statut à lister, `ACTIVE` par défaut.
      responses:
        '200':
          description: Véhicules triés par surnom
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [vehicles]
      operationId: createVehicle
      summary: Créer un véhicule (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleInput'
      responses:
        '201':
          description: Véhicule créé (statut ACTIVE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Immatriculation déjà utilisée (`REGISTRATION_ALREADY_EXISTS`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /vehicles/{vehicleId}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [vehicles]
      operationId: getVehicle
      summary: Détail d'un véhicule
      description: |
        Un USER n'obtient que ses véhicules actifs attribués. Pour tout autre véhicule, y
        compris inexistant, il reçoit 403 `VEHICLE_FORBIDDEN` sans détail. Un ADMIN reçoit
        404 pour un véhicule inexistant.
      responses:
        '200':
          description: Véhicule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [vehicles]
      operationId: updateVehicle
      summary: Modifier toutes les informations d'un véhicule (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleInput'
      responses:
        '200':
          description: Véhicule modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Immatriculation déjà utilisée (`REGISTRATION_ALREADY_EXISTS`) ou kilométrage de
            départ supérieur au plus petit kilométrage déjà saisi (`INITIAL_MILEAGE_ABOVE_RECORDS`, FR-009).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /vehicles/{vehicleId}/archive:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    post:
      tags: [vehicles]
      operationId: archiveVehicle
      summary: Archiver un véhicule (ADMIN, idempotent)
      responses:
        '200':
          description: Véhicule archivé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /vehicles/{vehicleId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    post:
      tags: [vehicles]
      operationId: reactivateVehicle
      summary: Réactiver un véhicule archivé (ADMIN, idempotent)
      responses:
        '200':
          description: Véhicule réactivé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Fonctionnalité 002 : kilométrage, entretiens, échéances, justificatifs.
  # Règle d'accès commune : tout membre ayant accès au véhicule (ADMIN, ou USER attribué sur
  # un véhicule actif) ; sinon 403 `VEHICLE_FORBIDDEN` sans détail, même pour une ressource
  # inexistante (un ADMIN reçoit 404). Toute écriture sur un véhicule archivé : 409
  # `VEHICLE_ARCHIVED`.
  # ---------------------------------------------------------------------------

  /operation-types:
    get:
      tags: [maintenance]
      operationId: listOperationTypes
      summary: Liste fixe des opérations d'entretien et intervalles par défaut
      description: |
        Les libellés sont côté frontend (`i18n/fr.ts`) ; le serveur ne fournit que les codes,
        dans l'ordre d'affichage, et l'intervalle proposé à la création d'une règle (FR-022).
      responses:
        '200':
          description: Opérations, dans l'ordre d'affichage
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationTypeInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /vehicles/{vehicleId}/history:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [maintenance]
      operationId: getVehicleHistory
      summary: Kilométrage actuel, totaux de dépenses et historique d'un véhicule
      description: |
        Historique du plus récent au plus ancien ; à date égale, le plus grand kilométrage en
        premier (FR-014). Un ADMIN peut consulter un véhicule archivé (FR-018).
      parameters:
        - name: operation
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OperationType'
          description: Ne garder que les entretiens comportant cette opération (les relevés sont alors exclus).
        - name: recordsOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Masquer les relevés simples (FR-016).
      responses:
        '200':
          description: Historique du véhicule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleHistory'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /vehicles/{vehicleId}/mileage-readings:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    post:
      tags: [mileage]
      operationId: createMileageReading
      summary: Enregistrer un relevé kilométrique
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MileageReadingInput'
      responses:
        '201':
          description: Relevé enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MileageReading'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MileageConflict'

  /mileage-readings/{readingId}:
    parameters:
      - $ref: '#/components/parameters/ReadingId'
    put:
      tags: [mileage]
      operationId: updateMileageReading
      summary: Corriger un relevé (auteur ou ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MileageReadingInput'
      responses:
        '200':
          description: Relevé corrigé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MileageReading'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MileageConflict'
    delete:
      tags: [mileage]
      operationId: deleteMileageReading
      summary: Supprimer définitivement un relevé (auteur ou ADMIN)
      responses:
        '204':
          description: Relevé supprimé ; le kilométrage actuel est recalculé
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VehicleArchived'

  /vehicles/{vehicleId}/maintenance-records:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    post:
      tags: [maintenance]
      operationId: createMaintenanceRecord
      summary: Enregistrer un entretien réalisé
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRecordInput'
      responses:
        '201':
          description: Entretien enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRecord'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MileageConflict'

  /maintenance-records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      tags: [maintenance]
      operationId: getMaintenanceRecord
      summary: Détail d'un entretien
      responses:
        '200':
          description: Entretien
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRecord'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [maintenance]
      operationId: updateMaintenanceRecord
      summary: Modifier un entretien (auteur ou ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRecordInput'
      responses:
        '200':
          description: Entretien modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRecord'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MileageConflict'
    delete:
      tags: [maintenance]
      operationId: deleteMaintenanceRecord
      summary: Supprimer définitivement un entretien et ses justificatifs (auteur ou ADMIN)
      responses:
        '204':
          description: Entretien et justificatifs supprimés ; kilométrage et échéances recalculés
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VehicleArchived'

  /vehicles/{vehicleId}/due-items:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [schedule]
      operationId: listVehicleDueItems
      summary: Échéances calculées d'un véhicule (règles et échéances à date fixe à faire)
      description: Triées en retard d'abord, puis par proximité (FR-027).
      responses:
        '200':
          description: Échéances du véhicule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DueItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /vehicles/{vehicleId}/maintenance-rules:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    post:
      tags: [schedule]
      operationId: createMaintenanceRule
      summary: Créer une règle d'échéance (une seule par opération et par véhicule)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRuleInput'
      responses:
        '201':
          description: Règle créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRule'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Une règle existe déjà pour cette opération (`RULE_ALREADY_EXISTS`) ou véhicule
            archivé (`VEHICLE_ARCHIVED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /maintenance-rules/{ruleId}:
    parameters:
      - $ref: '#/components/parameters/RuleId'
    put:
      tags: [schedule]
      operationId: updateMaintenanceRule
      summary: Modifier les intervalles ou le point de départ d'une règle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRuleUpdate'
      responses:
        '200':
          description: Règle modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRule'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VehicleArchived'
    delete:
      tags: [schedule]
      operationId: deleteMaintenanceRule
      summary: Supprimer une règle d'échéance
      responses:
        '204':
          description: Règle supprimée
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VehicleArchived'

  /vehicles/{vehicleId}/deadlines:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    post:
      tags: [schedule]
      operationId: createDeadline
      summary: Créer une échéance à date fixe (assurance, vignette…)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeadlineInput'
      responses:
        '201':
          description: Échéance créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deadline'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VehicleArchived'

  /deadlines/{deadlineId}:
    parameters:
      - $ref: '#/components/parameters/DeadlineId'
    put:
      tags: [schedule]
      operationId: updateDeadline
      summary: Modifier une échéance à date fixe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeadlineInput'
      responses:
        '200':
          description: Échéance modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deadline'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VehicleArchived'
    delete:
      tags: [schedule]
      operationId: deleteDeadline
      summary: Supprimer une échéance à date fixe
      responses:
        '204':
          description: Échéance supprimée
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VehicleArchived'

  /deadlines/{deadlineId}/complete:
    parameters:
      - $ref: '#/components/parameters/DeadlineId'
    post:
      tags: [schedule]
      operationId: completeDeadline
      summary: Marquer une échéance comme faite (crée la suivante si elle est récurrente)
      description: "Idempotent : une échéance déjà faite est renvoyée telle quelle."
      responses:
        '200':
          description: Échéance faite, et la suivante si elle est récurrente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadlineCompletion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VehicleArchived'

  /reminders:
    get:
      tags: [schedule]
      operationId: getReminders
      summary: Rappels de l'accueil pour les véhicules actifs accessibles au membre
      description: |
        Échéances « En retard » et « Bientôt » (FR-028) et véhicules sans kilométrage saisi
        depuis plus de 30 jours (FR-035). Les véhicules archivés n'y figurent jamais.
      responses:
        '200':
          description: Rappels, en retard d'abord
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminders'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /maintenance-records/{recordId}/documents:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      tags: [documents]
      operationId: listRecordDocuments
      summary: Justificatifs d'un entretien
      responses:
        '200':
          description: Justificatifs, du plus ancien au plus récent
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [documents]
      operationId: uploadRecordDocument
      summary: Joindre un justificatif (PDF, JPEG, PNG ou WebP, 10 Mo au plus)
      description: |
        Le format est vérifié sur le contenu du fichier (signature), pas sur l'extension ni
        sur le type annoncé par le navigateur. 10 justificatifs au plus par entretien.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Justificatif enregistré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Limite de 10 justificatifs atteinte (`DOCUMENT_LIMIT_REACHED`) ou véhicule archivé
            (`VEHICLE_ARCHIVED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Fichier de plus de 10 Mo (`DOCUMENT_TOO_LARGE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Format non accepté (`DOCUMENT_TYPE_NOT_ALLOWED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /documents/{documentId}/content:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      operationId: getDocumentContent
      summary: Contenu d'un justificatif, servi par le backend après contrôle d'accès
      description: |
        `Content-Disposition` vaut `inline` (aperçu) ou `attachment` (téléchargement) avec le
        nom d'origine ; `Cache-Control: private, no-store` ; `X-Content-Type-Options: nosniff`.
      parameters:
        - name: download
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Contenu du fichier
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Supprimer définitivement un justificatif (auteur ou ADMIN)
      responses:
        '204':
          description: Justificatif supprimé
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VehicleArchived'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
      description: Cookie de session créé après la connexion Google.

  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ReadingId:
      name: readingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeadlineId:
      name: deadlineId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: Aucune session valide (`UNAUTHENTICATED`) ; se connecter avec Google.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        Accès refusé : membre retiré de la liste blanche (`MEMBER_REVOKED`), action réservée
        aux ADMIN (`ADMIN_ONLY`) ou véhicule non accessible (`VEHICLE_FORBIDDEN`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Ressource introuvable (`NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Saisie invalide (`VALIDATION_ERROR`), avec un message par champ.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    VehicleArchived:
      description: Aucune saisie possible sur un véhicule archivé (`VEHICLE_ARCHIVED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MileageConflict:
      description: |
        Kilométrage incohérent avec un kilométrage daté avant ou après lui, ou inférieur au
        kilométrage de départ (`MILEAGE_INCONSISTENT`, le message cite la saisie en conflit) ;
        écart de plus de 100 000 km non confirmé (`MILEAGE_JUMP_NOT_CONFIRMED`, renvoyer avec
        `confirmLargeJump: true`) ; véhicule archivé (`VEHICLE_ARCHIVED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Role:
      type: string
      enum: [ADMIN, USER]

    CurrentMember:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          description: Nom affiché ; peut être absent avant la première connexion.
        role:
          $ref: '#/components/schemas/Role'

    Member:
      type: object
      required: [id, email, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          description: Absent si le membre ne s'est jamais connecté.

    MemberCreateRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Normalisé côté serveur (espaces retirés, minuscules).
        displayName:
          type: string
          maxLength: 100
        role:
          $ref: '#/components/schemas/Role'

    MemberUpdateRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 100
          description: Chaîne vide pour effacer le nom affiché.
        role:
          $ref: '#/components/schemas/Role'

    VehicleAccess:
      type: object
      required: [vehicleIds]
      properties:
        vehicleIds:
          type: array
          uniqueItems: true
          maxItems: 50
          items:
            type: string
            format: uuid

    VehicleStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]

    EnergyType:
      type: string
      enum: [PETROL, DIESEL, HYBRID, ELECTRIC, LPG, OTHER]

    VehicleInput:
      type: object
      required: [nickname, make, model, registration, initialMileageKm]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 50
        make:
          type: string
          minLength: 1
          maxLength: 50
        model:
          type: string
          minLength: 1
          maxLength: 50
        registration:
          type: string
          minLength: 2
          maxLength: 20
          description: |
            Unique parmi tous les véhicules (actifs et archivés), comparée sans tenir compte
            de la casse, des espaces ni des tirets.
        firstRegistrationYear:
          type: integer
          minimum: 1900
          description: Ne peut pas dépasser l'année courante (contrôlé côté serveur).
        initialMileageKm:
          type: integer
          minimum: 0
          maximum: 2000000
        vin:
          type: string
          pattern: '^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$'
        energyType:
          $ref: '#/components/schemas/EnergyType'

    Vehicle:
      type: object
      required: [id, nickname, make, model, registration, initialMileageKm, status, createdAt, updatedAt, currentMileage]
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        make:
          type: string
        model:
          type: string
        registration:
          type: string
        firstRegistrationYear:
          type: integer
        initialMileageKm:
          type: integer
        vin:
          type: string
        energyType:
          $ref: '#/components/schemas/EnergyType'
        status:
          $ref: '#/components/schemas/VehicleStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        currentMileage:
          $ref: '#/components/schemas/CurrentMileage'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Nom du champ du corps de requête (ex. `registration`).
        message:
          type: string
          description: Message en français expliquant quoi corriger.

    Problem:
      type: object
      description: Problem Details (RFC 9457) avec extensions carSupervision.
      required: [status, code, detail]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Message en français destiné à l'utilisateur.
        instance:
          type: string
        code:
          type: string
          description: Code stable exploitable par le frontend.
          enum:
            - UNAUTHENTICATED
            - MEMBER_REVOKED
            - ADMIN_ONLY
            - VEHICLE_FORBIDDEN
            - NOT_FOUND
            - VALIDATION_ERROR
            - EMAIL_ALREADY_EXISTS
            - REGISTRATION_ALREADY_EXISTS
            - LAST_ADMIN
            - MEMBER_IS_ADMIN
            - CSRF_INVALID
            - INTERNAL_ERROR
            - VEHICLE_ARCHIVED
            - NOT_AUTHOR
            - MILEAGE_INCONSISTENT
            - MILEAGE_JUMP_NOT_CONFIRMED
            - INITIAL_MILEAGE_ABOVE_RECORDS
            - RULE_ALREADY_EXISTS
            - DOCUMENT_TYPE_NOT_ALLOWED
            - DOCUMENT_TOO_LARGE
            - DOCUMENT_LIMIT_REACHED
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    # --- Fonctionnalité 002 -----------------------------------------------------

    OperationType:
      type: string
      description: Opération d'entretien (liste fixe, FR-011). Libellés dans `i18n/fr.ts`.
      enum:
        - SERVICE
        - OIL_CHANGE
        - OIL_FILTER
        - AIR_FILTER
        - CABIN_FILTER
        - FUEL_FILTER
        - TIRES
        - BRAKES
        - TIMING_BELT
        - BATTERY
        - AIR_CONDITIONING
        - TECHNICAL_INSPECTION
        - REPAIR
        - OTHER
    OperationTypeInfo:
      type: object
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/OperationType'
        defaultIntervalKm:
          type: integer
          description: Intervalle proposé en kilomètres (absent si aucun).
        defaultIntervalMonths:
          type: integer
          description: Intervalle proposé en mois (absent si aucun).

    CurrentMileage:
      type: object
      required: [mileageKm, date]
      properties:
        mileageKm:
          type: integer
        date:
          type: string
          format: date
          description: Date du kilométrage le plus récent (date de création du véhicule pour le kilométrage de départ).

    MileageReadingInput:
      type: object
      required: [readingDate, mileageKm]
      properties:
        readingDate:
          type: string
          format: date
          description: Pas dans le futur (jour de Paris).
        mileageKm:
          type: integer
          minimum: 0
          maximum: 9999999
        note:
          type: string
          maxLength: 200
        confirmLargeJump:
          type: boolean
          default: false
          description: Confirme un écart de plus de 100 000 km avec le kilométrage précédent (FR-007).
    MileageReading:
      type: object
      required: [id, vehicleId, readingDate, mileageKm, authorName, canEdit, createdAt, updatedAt, currentMileage]
      properties:
        id:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        readingDate:
          type: string
          format: date
        mileageKm:
          type: integer
        note:
          type: string
        authorName:
          type: string
        canEdit:
          type: boolean
          description: Vrai si le membre connecté est l'auteur ou un ADMIN.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        currentMileage:
          $ref: '#/components/schemas/CurrentMileage'

    MaintenanceRecordInput:
      type: object
      required: [recordDate, mileageKm, operations]
      properties:
        recordDate:
          type: string
          format: date
        mileageKm:
          type: integer
          minimum: 0
          maximum: 9999999
        operations:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OperationType'
        otherDescription:
          type: string
          maxLength: 200
          description: Obligatoire si `operations` contient `OTHER`.
        costCents:
          type: integer
          minimum: 0
          maximum: 100000000
          description: Coût total TTC en centimes d'euro (189,00 € = 18900).
        garage:
          type: string
          maxLength: 100
        notes:
          type: string
          maxLength: 2000
        confirmLargeJump:
          type: boolean
          default: false
    MaintenanceRecord:
      type: object
      required: [id, vehicleId, recordDate, mileageKm, operations, authorName, canEdit, documentCount, createdAt, updatedAt, currentMileage]
      properties:
        id:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        recordDate:
          type: string
          format: date
        mileageKm:
          type: integer
        operations:
          type: array
          items:
            $ref: '#/components/schemas/OperationType'
        otherDescription:
          type: string
        costCents:
          type: integer
        garage:
          type: string
        notes:
          type: string
        authorName:
          type: string
        canEdit:
          type: boolean
        documentCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        currentMileage:
          $ref: '#/components/schemas/CurrentMileage'

    HistoryEntryKind:
      type: string
      enum: [READING, RECORD]
    HistoryEntry:
      type: object
      description: |
        Une ligne de l'historique. Les champs `operations`, `otherDescription`, `costCents`,
        `garage`, `notes` et `documentCount` ne concernent que les entretiens (`RECORD`) ;
        `note` ne concerne que les relevés (`READING`).
      required: [kind, id, date, mileageKm, authorName, canEdit]
      properties:
        kind:
          $ref: '#/components/schemas/HistoryEntryKind'
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        mileageKm:
          type: integer
        authorName:
          type: string
        canEdit:
          type: boolean
        note:
          type: string
        operations:
          type: array
          items:
            $ref: '#/components/schemas/OperationType'
        otherDescription:
          type: string
        costCents:
          type: integer
        garage:
          type: string
        notes:
          type: string
        documentCount:
          type: integer
    CostTotals:
      type: object
      required: [year, currentYearCents, allTimeCents]
      properties:
        year:
          type: integer
          description: Année civile en cours (Paris).
        currentYearCents:
          type: integer
        allTimeCents:
          type: integer
    VehicleHistory:
      type: object
      required: [vehicleId, currentMileage, costTotals, entries]
      properties:
        vehicleId:
          type: string
          format: uuid
        currentMileage:
          $ref: '#/components/schemas/CurrentMileage'
        costTotals:
          $ref: '#/components/schemas/CostTotals'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEntry'

    MaintenanceRuleInput:
      type: object
      required: [operation]
      description: Au moins un des deux intervalles est obligatoire.
      properties:
        operation:
          $ref: '#/components/schemas/OperationType'
        intervalKm:
          type: integer
          minimum: 1
          maximum: 1000000
        intervalMonths:
          type: integer
          minimum: 1
          maximum: 240
        baselineDate:
          type: string
          format: date
          description: Dernière réalisation connue hors historique ; aujourd'hui par défaut.
        baselineMileageKm:
          type: integer
          minimum: 0
          description: Kilométrage de cette réalisation ; kilométrage actuel par défaut.
    MaintenanceRuleUpdate:
      type: object
      required: [baselineDate, baselineMileageKm]
      description: L'opération d'une règle ne change pas ; au moins un des deux intervalles est obligatoire.
      properties:
        intervalKm:
          type: integer
          minimum: 1
          maximum: 1000000
        intervalMonths:
          type: integer
          minimum: 1
          maximum: 240
        baselineDate:
          type: string
          format: date
        baselineMileageKm:
          type: integer
          minimum: 0
    MaintenanceRule:
      type: object
      required: [id, vehicleId, operation, baselineDate, baselineMileageKm]
      properties:
        id:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        operation:
          $ref: '#/components/schemas/OperationType'
        intervalKm:
          type: integer
        intervalMonths:
          type: integer
        baselineDate:
          type: string
          format: date
        baselineMileageKm:
          type: integer

    DeadlineInput:
      type: object
      required: [label, dueDate]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        dueDate:
          type: string
          format: date
        recurrenceMonths:
          type: integer
          minimum: 1
          maximum: 120
          description: Récurrence en mois (12 = chaque année) ; absente pour une échéance unique.
    Deadline:
      type: object
      required: [id, vehicleId, label, dueDate, done]
      properties:
        id:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        label:
          type: string
        dueDate:
          type: string
          format: date
        recurrenceMonths:
          type: integer
        done:
          type: boolean
        doneAt:
          type: string
          format: date-time
    DeadlineCompletion:
      type: object
      required: [completed]
      properties:
        completed:
          $ref: '#/components/schemas/Deadline'
        next:
          $ref: '#/components/schemas/Deadline'

    DueStatus:
      type: string
      description: |
        `OVERDUE` : date atteinte ou dépassée, ou kilométrage actuel ≥ kilométrage d'échéance.
        `SOON` : moins de 30 jours ou moins de 1 000 km restants. `OK` sinon. Avec deux termes,
        le plus défavorable l'emporte (FR-024).
      enum: [OVERDUE, SOON, OK]
    DueItemKind:
      type: string
      enum: [RULE, DEADLINE]
    DueItem:
      type: object
      description: |
        Échéance calculée (jamais stockée). Pour une règle (`RULE`) : `ruleId`, `operation`,
        intervalles, dernière réalisation, `dueDate` et/ou `dueMileageKm`. Pour une échéance à
        date fixe (`DEADLINE`) : `deadlineId`, `label`, `dueDate`, `recurrenceMonths`.
        `remainingDays` et `remainingKm` sont négatifs en cas de retard.
      required: [kind, status]
      properties:
        kind:
          $ref: '#/components/schemas/DueItemKind'
        status:
          $ref: '#/components/schemas/DueStatus'
        ruleId:
          type: string
          format: uuid
        deadlineId:
          type: string
          format: uuid
        operation:
          $ref: '#/components/schemas/OperationType'
        label:
          type: string
        intervalKm:
          type: integer
        intervalMonths:
          type: integer
        recurrenceMonths:
          type: integer
        lastDoneDate:
