databaseChangeLog:
  - changeSet:
      id: 001-create-member
      author: carsupervision
      changes:
        - createTable:
            tableName: member
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_member
              - column:
                  name: email
                  type: varchar(320)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_member_email
              - column:
                  name: display_name
                  type: varchar(100)
              - column:
                  name: role
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: last_login_at
                  type: timestamptz
        - sql:
            sql: ALTER TABLE member ADD CONSTRAINT ck_member_role CHECK (role IN ('ADMIN', 'USER'))
        - createIndex:
            tableName: member
            indexName: ix_member_role
            columns:
              - column:
                  name: role
