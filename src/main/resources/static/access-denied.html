<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accès refusé · carSupervision</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #475569; --accent: #2563eb; --border: #e2e8f0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #cbd5e1; --accent: #60a5fa; --border: #334155; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 12px; }
    a { display: inline-block; margin-top: 8px; color: var(--accent); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Accès refusé</h1>
    <p>Ce compte Google n'est pas autorisé à utiliser carSupervision.</p>
    <p>Demandez à un administrateur de la famille d'ajouter votre adresse email, puis reconnectez-vous.</p>
    <a href="/">Réessayer avec un autre compte</a>
  </main>
</body>
</html>
